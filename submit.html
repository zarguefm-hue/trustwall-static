<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شارك تجربتك — TrustWall</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="submit-page">
        <div class="submit-card">
            <div class="submit-header">
                <h1 id="welcomeMsg">شارك تجربتك معنا</h1>
                <p>رأيك يهمنا ويساعدنا على التحسن</p>
            </div>

            <form id="submitForm">
                <div class="form-group">
                    <label>اسمك الكامل *</label>
                    <input type="text" id="author_name" required placeholder="محمد الزروالي">
                </div>

                <div class="form-group">
                    <label>بريدك الإلكتروني (اختياري)</label>
                    <input type="email" id="author_email" placeholder="your@email.com">
                </div>

                <div class="form-group">
                    <label>تقييمك *</label>
                    <div class="rating-input">
                        <label><input type="radio" name="rating" value="5" checked> ⭐⭐⭐⭐⭐</label>
                        <label><input type="radio" name="rating" value="4"> ⭐⭐⭐⭐</label>
                        <label><input type="radio" name="rating" value="3"> ⭐⭐⭐</label>
                        <label><input type="radio" name="rating" value="2"> ⭐⭐</label>
                        <label><input type="radio" name="rating" value="1"> ⭐</label>
                    </div>
                </div>

                <div class="form-group">
                    <label>تجربتك *</label>
                    <textarea id="content" required rows="4" placeholder="اكتب تجربتك هنا..."></textarea>
                </div>

                <button type="submit" class="btn-primary btn-full btn-large">إرسال الشهادة</button>
            </form>

            <div id="successMsg" class="success-msg" style="display:none;">
                <h3>🎉 شكراً لك!</h3>
                <p>تم إرسال شهادتك بنجاح وهي قيد المراجعة.</p>
            </div>

            <div id="errorMsg" class="error-msg" style="display:none;"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/submit.js"></script>
</body>
</html>
